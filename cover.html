<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Necropolis cover</title>
    <style>
      @font-face {
        font-family: 'Cormorant Garamond';
        src: url('./fonts/cormorant-garamond-latin.woff2') format('woff2');
        font-weight: 500 700;
      }
      @font-face {
        font-family: 'Plus Jakarta Sans';
        src: url('./fonts/plus-jakarta-sans-latin.woff2') format('woff2');
        font-weight: 400 800;
      }
      html,
      body {
        margin: 0;
        width: 1500px;
        height: 1000px;
        overflow: hidden;
        background: #05070d;
        color: #e8e2d2;
        font-family: 'Plus Jakarta Sans', system-ui, sans-serif;
      }
      .cover {
        position: relative;
        width: 1500px;
        height: 1000px;
      }
      .cover img {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
        opacity: 0.85;
      }
      .scrim {
        position: absolute;
        inset: 0;
        background: linear-gradient(180deg, rgba(5, 7, 13, 0.15) 0%, rgba(5, 7, 13, 0.55) 55%, rgba(5, 7, 13, 0.95) 100%);
      }
      .badge {
        position: absolute;
        top: 56px;
        left: 64px;
        font-size: 22px;
        letter-spacing: 0.24em;
        text-transform: uppercase;
        color: rgba(232, 226, 210, 0.65);
      }
      .bottom {
        position: absolute;
        left: 64px;
        right: 64px;
        bottom: 70px;
      }
      h1 {
        font-family: 'Cormorant Garamond', Georgia, serif;
        font-weight: 600;
        font-size: 208px;
        line-height: 0.9;
        letter-spacing: 0.03em;
        margin: 0 0 18px;
        text-shadow: 0 8px 60px rgba(0, 0, 0, 0.6);
      }
      .line {
        font-size: 42px;
        color: #d6cfbd;
        letter-spacing: 0.01em;
      }
      .url {
        position: absolute;
        right: 64px;
        top: 58px;
        font-size: 19px;
        color: #e8a33d;
        letter-spacing: 0.02em;
      }
    </style>
  </head>
  <body>
    <div class="cover">
      <img src="./cover-bg.jpg" alt="" />
      <div class="scrim"></div>
      <div class="badge">Kiroween 2026 · Costume Contest</div>
      <div class="bottom">
        <h1>NECROPOLIS</h1>
        <div class="line">A graveyard for your dead side projects.</div>
      </div>
      <div class="url">hkmpn9s6dh-commits.github.io/hackathon-2026-kiroween</div>
    </div>
  </body>
</html>
